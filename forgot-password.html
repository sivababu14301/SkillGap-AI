<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – SkillGap AI</title>
    <meta name="description" content="Reset your password for SkillGap AI.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Navbar -->
    <nav class="auth-nav">
        <a href="index.html" class="logo">
            <span class="logo-icon"><i class="fas fa-robot"></i></span>
            SkillGap <span class="logo-ai">AI</span>
        </a>
        <a href="login.html" class="nav-register-btn">Login</a>
    </nav>

    <!-- Auth Container -->
    <main class="auth-main">
        <div class="auth-card">

            <!-- Left Panel: Illustration -->
            <div class="auth-left">
                <div class="auth-left-content">
                    <div class="left-badge"><i class="fas fa-key"></i> Account Recovery</div>
                    <h2>Forgot Password?</h2>
                    <p>Enter your email address and we will send you instructions to reset your password.</p>
                    <div class="left-illustration" style="margin-top: 2rem;">
                        <i class="fas fa-unlock-alt" style="font-size: 8rem; color: #4F46E5; filter: drop-shadow(0 0 20px rgba(79, 70, 229, 0.4));"></i>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Forgot Password Form -->
            <div class="auth-right">
                <div class="auth-form-wrapper">
                    <div class="form-header">
                        <h1>Reset <span class="gradient-text">Password</span></h1>
                        <p>We'll help you get back into your account</p>
                    </div>

                    <!-- Error / Success Message -->
                    <div id="forgotMsg" class="auth-msg" style="display:none;"></div>

                    <!-- Forgot Password Form -->
                    <form id="forgotForm" class="auth-form" novalidate>
                        
                        <div class="form-group" id="emailGroup">
                            <label for="forgotEmail">Email Address</label>
                            <div class="input-wrapper">
                                <i class="fas fa-envelope input-icon"></i>
                                <input
                                    type="email"
                                    id="forgotEmail"
                                    name="email"
                                    placeholder="Enter your registered email"
                                    autocomplete="email"
                                    required
                                >
                            </div>
                            <span class="field-error" id="emailError"></span>
                        </div>

                        <!-- Step 2: Password Remember Access (Hidden Initially) -->
                        <div id="rememberAccessSection" style="display:none; margin-bottom: 20px;">
                            <div class="form-group">
                                <label for="forgotRememberKey" style="text-align: left; display: block;">Password Remember Access</label>
                                <div style="display: flex; gap: 8px; align-items: center;">
                                    <div class="input-wrapper" style="flex: 1;">
                                        <i class="fas fa-key input-icon"></i>
                                        <input
                                            type="text"
                                            id="forgotRememberKey"
                                            placeholder="Enter your Remember Access key"
                                        >
                                    </div>
                                    <button type="button" id="accessBtn" style="padding: 0 16px; height: 46px; border-radius: 8px; border: 1px solid rgba(79, 70, 229, 0.4); background: rgba(79, 70, 229, 0.15); color: #818CF8; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap;">HIT</button>
                                </div>
                            </div>
                        </div>

                        <!-- Step 3 Fields (Hidden Initially) -->
                        <div id="passwordFields" style="display:none;">
                            <div class="form-group">
                                <label for="newPassword">New Password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock input-icon"></i>
                                    <input
                                        type="password"
                                        id="newPassword"
                                        name="newPassword"
                                        placeholder="Enter new password"
                                    >
                                </div>
                                <span class="field-error" id="newPasswordError"></span>
                            </div>

                            <div class="form-group">
                                <label for="confirmPassword">Confirm Password</label>
                                <div class="input-wrapper">
                                    <i class="fas fa-lock input-icon"></i>
                                    <input
                                        type="password"
                                        id="confirmPassword"
                                        name="confirmPassword"
                                        placeholder="Confirm new password"
                                    >
                                </div>
                                <span class="field-error" id="confirmPasswordError"></span>
                            </div>
                        </div>

                        <button type="submit" class="btn-auth" id="forgotBtn">
                            <span class="btn-text" id="btnText"><i class="fas fa-arrow-right"></i> Continue</span>
                            <span class="btn-spinner" id="btnSpinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i> <span class="spinner-text">Processing...</span></span>
                        </button>

                        <p class="auth-switch">
                            Remember your password? <a href="login.html" class="switch-link">Back to Login</a>
                        </p>
                        
                    </form>
                </div>
            </div>

        </div>
    </main>

    <script src="forgot-password.js?v=2"></script>
</body>
</html>
