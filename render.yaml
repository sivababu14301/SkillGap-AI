services:
  - type: web
    name: skillgap-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB
        value: skillgap_ai
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
