<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – SkillGap AI</title>
    <meta name="description" content="Login to SkillGap AI to analyze your skills, close career gaps, and get AI-powered career recommendations.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Navbar -->
    <nav class="auth-nav">
        <a href="index.html" class="logo">
            <span class="logo-icon"><i class="fas fa-robot"></i></span>
            SkillGap <span class="logo-ai">AI</span>
        </a>
        <a href="register.html" class="nav-register-btn">Create Account</a>
    </nav>

    <!-- Auth Container -->
    <main class="auth-main">
        <div class="auth-card">

            <!-- Left Panel: Illustration -->
            <div class="auth-left">
                <div class="auth-left-content">
                    <div class="left-badge"><i class="fas fa-shield-alt"></i> Secure Login</div>
                    <h2>Welcome Back!</h2>
                    <p>Login to continue your journey towards a better career with AI-powered guidance.</p>
                    <div class="left-illustration">
                        <img src="assets/login-boy.png" alt="Student boy using laptop with security shield">
                    </div>
                    <div class="left-stats">
                        <div class="stat-item">
                            <span class="stat-num">10K+</span>
                            <span class="stat-label">Students</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-item">
                            <span class="stat-num">95%</span>
                            <span class="stat-label">Accuracy</span>
                        </div>
                        <div class="stat-divider"></div>
                        <div class="stat-item">
                            <span class="stat-num">500+</span>
                            <span class="stat-label">Job Roles</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Login Form -->
            <div class="auth-right">
                <div class="auth-form-wrapper">
                    <div class="form-header">
                        <h1>Welcome to <span class="gradient-text">SkillGap AI</span></h1>
                        <p>Login to your account to continue</p>
                    </div>

                    <!-- Error / Success Message -->
                    <div id="loginMsg" class="auth-msg" style="display:none;"></div>

                    <!-- Login Form -->
                    <form id="loginForm" class="auth-form" novalidate>
                        
                        <!-- Single Login for Both User and Admin -->

                        <div class="form-group">
                            <label for="loginEmail">Email Address</label>
                            <div class="input-wrapper">
                                <i class="fas fa-envelope input-icon"></i>
                                <input
                                    type="email"
                                    id="loginEmail"
                                    name="email"
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required
                                >
                            </div>
                            <span class="field-error" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock input-icon"></i>
                                <input
                                    type="password"
                                    id="loginPassword"
                                    name="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >
                                <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)" tabindex="-1">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <span class="field-error" id="passwordError"></span>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" id="rememberMe">
                                <span class="custom-check"></span>
                                Remember me
                            </label>
                            <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn-auth" id="loginBtn">
                            <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login</span>
                            <span class="btn-spinner" style="display:none;"><i class="fas fa-spinner fa-spin"></i> Logging in...</span>
                        </button>

                        <p class="auth-switch">
                            Don't have an account? <a href="register.html" class="switch-link">Register here</a>
                        </p>
                        

                    </form>
                </div>
            </div>

        </div>
    </main>

    <script src="auth.js"></script>
</body>
</html>
